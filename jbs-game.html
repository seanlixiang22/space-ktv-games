<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>剧本杀·集卡闯关</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE 夜色里的剧本杀店：千禧年的布雷诺，烟、火柴、孤挺花
   IDEA 一叠角色卡 + 一张夜里的街区地图；打本发码、抽卡、布阵、闯关
   PICTURE 大厅里 Q 版角色走来走去冒对话；战斗是两块 3×3 站位棋盘
   COLOUR 墨夜 #15110f、纸色 #f3e9da、孤挺花红 #c8323c、火柴金 #e7b24a
   TYPE Noto Serif SC 标题，Noto Sans SC 正文
   LAYOUT 顶栏资源 + 五个页签；手机上单列 */
:root{color-scheme:dark;--bg:#15110f;--bg2:#1f1916;--card:#2a221e;--line:#3d322c;--ink:#f3e9da;--mut:#b8a998;--red:#c8323c;--gold:#e7b24a;--green:#4fa36b;--R:#7fa7c9;--SR:#b48ae0;--SSR:#e7b24a;--UR:#ff5a6a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans SC",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;min-height:44px}
button:hover{border-color:var(--gold)}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.pri{background:var(--red);border-color:var(--red);font-weight:700}button.pri:hover{filter:brightness(1.1)}
button:disabled{opacity:.45;cursor:not-allowed}
input{font:16px "Noto Sans SC",sans-serif;background:#0f0c0b;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
h1,h2,h3{font-family:"Noto Serif SC",serif;margin:0;line-height:1.1}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px max(4vw,12px);background:rgba(21,17,15,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.top h1{font-size:20px;letter-spacing:1px}.top h1 span{color:var(--red)}
.res{display:flex;gap:14px;margin-left:auto;font-size:14px;color:var(--mut)}.res b{color:var(--ink);font-size:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;width:100%}
nav button{flex:1;min-width:64px;padding:8px 6px;background:transparent}
nav button.on{background:var(--card);border-color:var(--gold);color:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:18px max(4vw,12px) 60px}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:13px}
.hide{display:none!important}
/* 大厅 */
.room{position:relative;height:clamp(320px,52vh,520px);border-radius:18px;overflow:hidden;border:1px solid var(--line);
 background:radial-gradient(ellipse at 50% 0%,rgba(231,178,74,.22),transparent 55%),linear-gradient(#2b201b 0 62%,#3a2a20 62%);}
.room .shelf{position:absolute;top:8%;height:22%;border:3px solid #4a382c;border-radius:6px;background:repeating-linear-gradient(90deg,#3b2c23 0 18px,#5b2a2a 18px 30px,#2d4a3f 30px 40px,#3b2c23 40px 64px)}
.room .lamp{position:absolute;top:0;width:2px;height:16%;background:#6b5643}.room .lamp::after{content:"";position:absolute;bottom:-14px;left:-14px;width:30px;height:16px;border-radius:30px 30px 4px 4px;background:var(--gold);box-shadow:0 10px 50px 18px rgba(231,178,74,.35)}
.room .table{position:absolute;bottom:14%;width:26%;height:12%;border-radius:50%;background:#5a3e2c;box-shadow:inset 0 -8px 0 #3e2a1e}
.walker{position:absolute;width:72px;transition:left linear,top linear,transform linear;transform:translate(-50%,-100%) scale(var(--ws,1));transform-origin:50% 100%;cursor:pointer;z-index:2}
.walker .av{width:72px;height:96px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.45))}
.walker.flip .av{transform:scaleX(-1)}
.walker .nm{text-align:center;font-size:11px;color:var(--mut);margin-top:-2px}
.bubble{position:absolute;bottom:104px;left:50%;transform:translateX(-50%);width:max-content;max-width:180px;background:var(--ink);color:#201814;font-size:13px;padding:6px 10px;border-radius:12px;line-height:1.35;animation:pop .25s}
.bubble::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.idle{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-top:14px}
.big{font-size:30px;font-family:"Noto Serif SC",serif;color:var(--gold)}
/* 卡 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ccard{position:relative;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 6px 8px;text-align:center;cursor:pointer;user-select:none}
.ccard .av{width:100%;height:110px}img.av{object-fit:contain;display:block}
.ccard .n{font-weight:700;font-size:14px}.ccard .s{font-size:12px;color:var(--gold);letter-spacing:1px}
.ccard .tag{position:absolute;top:6px;left:6px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:#0008}
.ccard.R{border-color:var(--R)}.ccard.SR{border-color:var(--SR)}.ccard.SSR{border-color:var(--SSR)}.ccard.UR{border-color:var(--UR)}
.ccard.R .tag{color:var(--R)}.ccard.SR .tag{color:var(--SR)}.ccard.SSR .tag{color:var(--SSR)}.ccard.UR .tag{color:var(--UR)}
.ccard.on{outline:3px solid var(--gold)}.ccard.lock{opacity:.35}
.ccard.new::after{content:"NEW";position:absolute;top:6px;right:6px;font-size:10px;background:var(--red);padding:1px 5px;border-radius:5px}
.gres .ccard{animation:flip .45s backwards}
@keyframes flip{from{transform:rotateY(90deg)}}
.gres .ccard.SSR,.gres .ccard.UR{box-shadow:0 0 24px rgba(231,178,74,.55)}
/* 布阵 */
.form{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px}
@media(max-width:760px){.form{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;aspect-ratio:1;max-width:340px}
.cell{border:1px dashed #5b4a3e;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;background:#1a1411;cursor:pointer}
.cell.sel{border:2px solid var(--gold)}
.cell .av{width:90%;height:90%}.cell .cn{position:absolute;bottom:2px;font-size:11px;background:#000a;padding:0 4px;border-radius:4px}
.collab{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);max-width:340px;margin-top:4px}
.syn div{padding:6px 10px;border-radius:8px;background:var(--card);margin-bottom:6px;font-size:13px}
.syn div.off{opacity:.45}.syn b{color:var(--gold)}
/* 关卡 */
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stage{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left}
.stage.boss{border-color:var(--red)}.stage .st{color:var(--gold);letter-spacing:2px}
/* 战斗 */
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.side{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.vs{font-family:"Noto Serif SC";color:var(--red);font-size:22px}
.unit{position:relative;background:#1a1411;border:1px solid var(--line);border-radius:10px;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:visible}
.unit.empty{opacity:.15}
.unit .av{width:100%;flex:1}
.unit .un{font-size:11px;white-space:nowrap}
.bar{width:92%;height:5px;background:#000;border-radius:3px;margin:2px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.bar.mp i{background:#4b86d1}.bar.sh{position:absolute;top:4px;height:4px}.bar.sh i{background:#ddd}
.unit.dead{filter:grayscale(1) brightness(.4)}
.unit.hit{animation:shake .2s}@keyframes shake{50%{transform:translateX(3px)}}
.unit .st{position:absolute;top:4px;right:4px;font-size:10px;display:flex;flex-direction:column;gap:1px;align-items:flex-end}
.unit .st span{background:#000b;padding:0 3px;border-radius:3px}
.fx{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:900;pointer-events:none;animation:up .8s forwards;z-index:5;text-shadow:0 1px 2px #000}
@keyframes up{to{transform:translate(-50%,-36px);opacity:0}}
.cast{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);background:var(--red);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px;white-space:nowrap;animation:up 1.2s forwards;z-index:6}
.blog{height:120px;overflow:auto;font-size:12px;color:var(--mut);background:#0f0c0b;border-radius:10px;padding:8px;margin-top:10px}
.cpbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.cpbar span{background:var(--card);padding:2px 8px;border-radius:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:1100;padding:16px}
.modal .panel{max-width:min(720px,100%);max-height:90vh;overflow:auto;width:100%}
.gate{text-align:center}.gate h2{font-size:34px;margin:10px 0}.gate p{color:var(--mut)}
.det{display:grid;grid-template-columns:140px 1fr;gap:14px}
@media(max-width:520px){.det{grid-template-columns:1fr}.unit .un{font-size:9px}.vs{font-size:16px}.res{gap:8px;font-size:12px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#201814;padding:8px 16px;border-radius:10px;z-index:1200;font-weight:700}
/* ===== 抽卡演出（可跳过） ===== */
.gx{position:fixed;inset:0;z-index:1200;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#f3e9da;-webkit-user-select:none;user-select:none}
.gxBg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,var(--gc2) 0%,#0b0807 62%),#0b0807;transition:background .6s}
.gxBg::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 8%,var(--gc) 9%,transparent 11% 24%,var(--gc) 25%,transparent 27% 41%,var(--gc) 42%,transparent 44% 58%,var(--gc) 59%,transparent 61% 74%,var(--gc) 75%,transparent 77% 91%,var(--gc) 92%,transparent 94%);opacity:.13;animation:gxSpin 18s linear infinite}
.gx.b-R{--gc:#7fa7c9;--gc2:#1b2633}.gx.b-SR{--gc:#b691d6;--gc2:#2a1d3a}.gx.b-SSR{--gc:#e7b24a;--gc2:#3d2a12}.gx.b-UR{--gc:#ff5a6e;--gc2:#3d1220}
.gx.hold .gxBg{--gc2:#1d1714;--gc:#e7b24a}
@keyframes gxSpin{to{transform:rotate(360deg)}}
.gxTop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;z-index:5;font-weight:700;letter-spacing:.1em;color:#e7b24a}
.gxTop button{background:#0008;border:1px solid #ffffff33;color:#f3e9da;border-radius:999px;padding:8px 16px;font-size:14px;min-height:40px}
.gxOrb{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;cursor:pointer}
.gxOrb i{width:150px;height:200px;border-radius:14px;position:relative;background:linear-gradient(135deg,#3a2a20,#1a1411);border:2px solid #e7b24a;box-shadow:0 0 30px var(--gc),0 0 90px var(--gc),inset 0 0 30px #0008;animation:gxPulse 1.1s ease-in-out infinite}
.gxOrb i::after{content:"剧";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 64px/1 serif;color:#e7b24a;text-shadow:0 0 18px var(--gc)}
.gx.hold .gxOrb i{box-shadow:0 0 24px #e7b24a88,inset 0 0 30px #0008}
.gxOrb b{font-size:15px;color:#e7b24a;letter-spacing:.2em;animation:gxBlink 1.2s infinite}
@keyframes gxPulse{50%{transform:scale(1.05) rotate(-1.5deg)}}
@keyframes gxBlink{50%{opacity:.35}}
.gx.burst .gxOrb i{animation:gxBurst .55s ease-in forwards}
@keyframes gxBurst{to{transform:scale(1.5);opacity:0;filter:brightness(3)}}
.gxFlash{position:absolute;inset:0;z-index:4;background:radial-gradient(circle,#fff,var(--gc) 40%,transparent 75%);opacity:0;pointer-events:none}
.gx.burst .gxFlash{animation:gxFl .7s ease-out}
@keyframes gxFl{20%{opacity:.95}100%{opacity:0}}
.gxGrid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,minmax(0,118px));gap:12px;padding:0 12px;perspective:900px}
.gxGrid.n1{grid-template-columns:minmax(0,190px)}
.gxc{aspect-ratio:3/4.3;position:relative;animation:gxDeal .45s cubic-bezier(.2,1.4,.4,1) backwards;cursor:pointer}
@keyframes gxDeal{from{transform:translateY(60vh) rotate(-25deg) scale(.4);opacity:0}}
.gxIn{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.gxc.open .gxIn{transform:rotateY(180deg)}
.gxBack,.gxFace{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px}
.gxBack{background:repeating-linear-gradient(45deg,#2a1f1b 0 8px,#231a16 8px 16px);border:2px solid #e7b24a99;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px #000a}
.gxBack span{font:900 34px/1 serif;color:#e7b24a;opacity:.8}
.gxc.SSR .gxBack,.gxc.UR .gxBack{animation:gxHint 1s ease-in-out infinite}
.gxc.SSR .gxBack{border-color:#ffd36a;box-shadow:0 0 22px #e7b24aaa}.gxc.UR .gxBack{border-color:#ff7a8a;box-shadow:0 0 22px #ff5a6eaa}
@keyframes gxHint{50%{filter:brightness(1.35)}}
.gxFace{transform:rotateY(180deg)}.gxFace .ccard{height:100%;margin:0;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end}
.gxFace .ccard .av{flex:1;min-height:0;height:auto}
.gxc.open.SSR .gxFace .ccard,.gxc.open.UR .gxFace .ccard{box-shadow:0 0 26px #e7b24acc;animation:gxGlow 1.6s ease-in-out infinite}
.gxc.open.UR .gxFace .ccard{box-shadow:0 0 30px #ff5a6ecc}
@keyframes gxGlow{50%{filter:brightness(1.18)}}
.gxc.open.SR .gxFace .ccard{box-shadow:0 0 16px #b691d699}
.gxCut{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;cursor:pointer;background:linear-gradient(100deg,#000e 0 30%,#000c 60%,#000e)}
.gxCut::before{content:"";position:absolute;left:-10%;right:-10%;top:38%;height:30%;background:linear-gradient(90deg,transparent,var(--cc),transparent);transform:skewY(-8deg);opacity:.35;animation:gxBand .5s ease-out}
@keyframes gxBand{from{transform:skewY(-8deg) scaleX(0)}}
.gxCut img,.gxCut svg{position:relative;height:min(68vh,560px);width:auto;max-width:60vw;object-fit:contain;filter:drop-shadow(0 0 30px var(--cc));animation:gxIn .6s cubic-bezier(.2,1.3,.4,1)}
@keyframes gxIn{from{transform:translateX(-30vw) scale(.8);opacity:0}}
.gxCut .gxInfo{position:relative;margin-left:2vw;max-width:46vw;animation:gxIn2 .6s .15s cubic-bezier(.2,1.3,.4,1) backwards}
@keyframes gxIn2{from{transform:translateX(30vw);opacity:0}}
.gxCut .gxR{font:900 clamp(40px,9vw,84px)/1 serif;color:var(--cc);text-shadow:0 0 24px var(--cc)}
.gxCut .gxN{font-size:clamp(26px,5vw,44px);font-weight:900;margin:6px 0 2px}
.gxCut .gxB{color:#b8a998;font-size:14px}
.gxCut .gxL{margin-top:12px;font-size:clamp(14px,2.4vw,18px);border-left:3px solid var(--cc);padding-left:10px}
.gxCut .gxNew{display:inline-block;margin-top:10px;background:#c8323c;color:#fff;font-weight:900;border-radius:6px;padding:2px 10px;font-size:13px}
.gxCut .gxTap{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#b8a998;font-size:13px;animation:gxBlink 1.2s infinite}
.gxEnd{position:relative;z-index:3;display:flex;gap:10px;margin-top:22px;animation:gxIn2 .4s}
.gxEnd button{min-width:120px;min-height:46px;font-size:16px}
.gx .hide{display:none!important}
@media(max-width:760px){
  .gxGrid{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%;padding:0 8px}
  .gxGrid.n1{grid-template-columns:minmax(0,170px);width:auto}
  .gxFace .ccard .n{font-size:10px}.gxFace .ccard .s{font-size:9px}.gxFace .ccard .tag{font-size:9px}
  .gxBack span{font-size:22px}
  .gxCut{flex-direction:column}
  .gxCut img,.gxCut svg{height:52vh;max-width:80vw}
  .gxCut .gxInfo{margin:-20px 0 0;max-width:86vw;text-align:center}
  .gxCut .gxL{border-left:0;padding:0}
  .gxEnd{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:12px;right:12px;margin:0}.gxEnd button{flex:1}
}
@media(max-width:760px) and (orientation:landscape){.gxGrid{grid-template-columns:repeat(10,minmax(0,1fr))}.gxCut{flex-direction:row}.gxCut img,.gxCut svg{height:78vh}}
@media(prefers-reduced-motion:reduce){.gxBg::before,.gxOrb i,.gxc,.gxc .gxIn{animation:none!important;transition:none!important}}
@media(prefers-reduced-motion:reduce){.walker{transition:none}.gres .ccard,.fx,.cast,.bubble{animation:none}}
.bk{margin:16px 0 8px;font-size:15px}
/* ===== 2.5D 战斗 ===== */
#bt{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;background:linear-gradient(#0a0807aa,#0a0807cc),url(jbs/bg_battle_h.webp) center/cover,#15110f;overflow:hidden}body.btV #bt{background:linear-gradient(#0a0807aa,#0a0807cc),url(jbs/bg_battle_v.webp) center/cover,#15110f}
/* 大厅背景图（jbs/bg_lobby.webp）：地板用图里的，不再画 CSS 网格 */
.room.img{background:url(jbs/bg_lobby.webp) center bottom/cover,#2b201b}.room.img::after{display:none}
#bt.hide{display:none}
#bt::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,#ffffff05 0 2px,transparent 2px 90px),radial-gradient(ellipse at 50% 120%,#c8323c22,transparent 60%)}
.btTop{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:10px max(3vw,12px);border-bottom:1px solid var(--line);background:#15110fcc}
.btTitle{display:flex;flex-direction:column;line-height:1.15;min-width:0}.btTitle small{color:var(--mut);font-size:12px}.btTitle b{font-family:"Noto Serif SC",serif;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btTime{margin-left:auto;font:900 22px "Noto Serif SC",serif;color:var(--gold);min-width:2.2em;text-align:center}
.btBtns{display:flex;gap:6px}.btBtns button{padding:6px 12px;min-height:40px}
.btWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 6px}
#btStage{position:relative;width:min(100%,1100px,calc((100dvh - 150px)*1.7));aspect-ratio:1.7}
#btFloor,#btFx{position:absolute;left:0;top:0;pointer-events:none}#btFx{z-index:500}
#btLayer{position:absolute;inset:0}
.bu{position:absolute;width:var(--uw,80px);transform:translate(-50%,-100%) scale(var(--s,1));transform-origin:50% 100%;transition:opacity .5s,filter .5s}
.bu .bsh{position:absolute;left:12%;right:12%;bottom:-6%;height:16%;border-radius:50%;background:radial-gradient(#000a,#0000 70%)}
.bu.p .bsh{box-shadow:0 0 0 2px #e7b24a55,0 0 14px #e7b24a44}.bu.e .bsh{box-shadow:0 0 0 2px #7fa7c955,0 0 14px #7fa7c944}
.bu .bspr{position:relative}.bu .bbob{animation:bob 2.4s ease-in-out infinite}
.bu .av{display:block;width:100%;height:auto;aspect-ratio:100/134;object-fit:contain;filter:drop-shadow(0 4px 3px #000a)}
.bu.e img.av{transform:scaleX(-1)}body.btV .bu.e img.av{transform:none}
@keyframes bob{50%{transform:translateY(-3%)}}
.bu .bhud{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);width:max(74%,46px);display:flex;flex-direction:column;align-items:center;gap:1px;margin-bottom:2px}
.bu .bnm{font-size:11px;white-space:nowrap;text-shadow:0 1px 2px #000;color:var(--ink)}
.bu.boss .bnm{color:#ff8a8a;font-weight:700}

const SECRET='brenno-jbs-2026';
function fnv(s){let h=0x811c9dc5;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0').toUpperCase()}
function checkCode(raw){
  const c=String(raw||'').trim().toUpperCase().replace(/\s+/g,'');
  const m=c.match(/^([A-Z]{2})-([A-Z0-9]{5})-([0-9A-F]{4})$/);
  if(!m)return null;
  if(fnv(SECRET+m[1]+m[2]).slice(0,4)!==m[3])return null;
  return {code:c,kind:m[1]==='YQ'?'invite':'redeem',book:m[1]};
}

// 立绘加载失败（比如 jbs 文件夹没传）时退回 SVG 小人
const avFb=new Map();let avN=0;
function avFail(img){const lk=avFb.get(img.dataset.fb);img.onerror=null;if(lk)img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(avSvg(lk).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '))}
function av(look,key,flip){
  const ak=key?artKey(key):look&&look.art;
  if(ak&&ART.has(ak)){if(!avFb.has(ak))avFb.set(ak,look);return `<img class="av" src="jbs/${ak}.webp" alt="" loading="lazy" decoding="async" data-fb="${ak}" onerror="avFail(this)">`}
  return avSvg(look,flip);
}

/* ================= 大厅 ================= */
let lobbyT=[];
function stopLobby(){lobbyT.forEach(clearTimeout);lobbyT=[]}
const DAILY_SWAP=20;
const today=()=>new Date().toDateString();
const swapLeft=()=>Math.max(0,DAILY_SWAP-(S.swapDay===today()?S.swapN||0:0));
function idleTick(){
  const now=Date.now(),cap=12*3600e3;
  const dt=Math.min(now-(S.lastIdle||now),cap);
  const n=Math.max(1,Math.min(10,Object.keys(S.own).length));
  S.clues+=dt/3600e3*10*n; S.lastIdle=now; save(); res();
}
function lobby(){
  idleTick();
  const owned=Object.keys(S.own);
  const who=owned.filter(k=>C[k]).sort(()=>Math.random()-.5).slice(0,10);
  const rate=10*Math.max(1,Math.min(10,owned.length));
  $('#main').innerHTML=`
  <div class="room img" id="room"></div>
  <div class="idle">
    <div class="panel"><div class="mut">挂机线索（大厅里每个角色每小时 10 条，最多攒 12 小时）</div>
      <div class="big"><span id="clue">${Math.floor(S.clues)}</span> 条</div><div class="mut">当前每小时 ${rate} 条 · 100 条线索换 1 张抽卡券 · 今天还能换 ${swapLeft()} 张</div>
      <div class="row" style="margin-top:10px"><button class="pri" id="swap" ${S.clues<100||!swapLeft()?'disabled':''}>兑换抽卡券</button></div></div>
    <div class="panel"><div class="mut">打完本拿到的兑换码填这里，每码抽 100 次，必出 SSR</div>
      <div class="row" style="margin-top:10px"><input id="rc" placeholder="LM-XXXXX-XXXX" autocomplete="off" aria-label="兑换码" style="flex:1"><button class="pri" id="rcb">兑换</button></div>
      <div class="mut" id="rcm" style="margin-top:6px">兑换码只在这台设备上记录是否用过。</div></div>
  </div>`;
  const room=$('#room');
  const W=()=>room.clientWidth,H=()=>room.clientHeight;
  const ws=who.map((k,i)=>{
    const d=document.createElement('div');d.className='walker';d.dataset.k=k;
    d.innerHTML=av(C[k].look,k)+`<div class="nm">${esc(C[k].n)}</div>`;
    d.style.left=(10+Math.random()*80)+'%';const y0=68+Math.random()*26;d.style.top=y0+'%';d.style.setProperty('--ws',(.72+(y0-66)/28*.42).toFixed(3));d.style.zIndex=Math.round(y0);
    room.appendChild(d);return d;
  });
  const walk=d=>{
    const nx=8+Math.random()*84,ny=66+Math.random()*28;
    const cx=parseFloat(d.style.left);d.classList.toggle('flip',nx<cx);
    const dist=Math.hypot((nx-cx)*W()/100,(ny-parseFloat(d.style.top))*H()/100);
    const t=Math.max(1200,dist*28);d.style.transitionDuration=t+'ms';d.style.left=nx+'%';d.style.top=ny+'%';d.style.setProperty('--ws',(.72+(ny-66)/28*.42).toFixed(3));
    d.style.zIndex=Math.round(ny);
    lobbyT.push(setTimeout(()=>walk(d),t+1500+Math.random()*4000));
  };
  const say=(d,t)=>{d.querySelector('.bubble')?.remove();const b=document.createElement('div');b.className='bubble';b.textContent=t;d.appendChild(b);lobbyT.push(setTimeout(()=>b.remove(),3600))};
  ws.forEach((d,i)=>{lobbyT.push(setTimeout(()=>walk(d),300+i*300));d.onclick=()=>say(d,rand(C[d.dataset.k].lines))});
  const chatter=()=>{
    const pairs=PAIRS.filter(p=>who.includes(p[0])&&who.includes(p[1]));
    if(pairs.length&&Math.random()<.4){const p=rand(pairs);const a=ws.find(d=>d.dataset.k===p[0]),b=ws.find(d=>d.dataset.k===p[1]);say(a,p[2]);lobbyT.push(setTimeout(()=>say(b,p[3]),1600))}
    else if(ws.length){const d=rand(ws);say(d,rand(C[d.dataset.k].lines))}
    lobbyT.push(setTimeout(chatter,4000+Math.random()*5000));
  };
  lobbyT.push(setTimeout(chatter,1500));
  const tick=()=>{idleTick();const e=$('#clue');if(e){e.textContent=Math.floor(S.clues);$('#swap').disabled=S.clues<100||!swapLeft()}lobbyT.push(setTimeout(tick,5000))};
  lobbyT.push(setTimeout(tick,5000));
}

/* ================= 抽卡 ================= */
function pullOne(up,forceSR){
  let r;
  const roll=Math.random()*100;
  r=roll<1?'UR':roll<10?'SSR':roll<40?'SR':'R';
  if(forceSR&&r==='R')r='SR';
  const pool=KEYS.filter(k=>C[k].r===r);
  const w=pool.map(k=>up&&C[k].b===up?2:1);
  let x=Math.random()*w.reduce((a,b)=>a+b,0),pick=pool[0];
  for(let i=0;i<pool.length;i++){x-=w[i];if(x<=0){pick=pool[i];break}}
  return pick;
}
function doPulls(n,up,guaranteeSSR){
  const out=[];
  for(let i=0;i<n;i++){
    S.pity++;
    let k=pullOne(up,S.pity>=10);
    if(C[k].r!=='R')S.pity=0;
    out.push(k);
  }
  if(guaranteeSSR&&!out.some(k=>C[k].r==='SSR'||C[k].r==='UR')){
    const pool=KEYS.filter(k=>C[k].r==='SSR');out[out.length-1]=rand(pool);
  }
  const res=out.map(k=>{const isNew=!S.own[k];S.own[k]=(S.own[k]||0)+1;return {k,isNew}});
  save();res&&showPulls(res);
  return out;
}
/* 抽卡演出：蓄力卡 → 发牌 → 逐张翻开；SSR/UR 全屏特写（点一下继续）；右上角随时跳过 */
let GX=null;
function showPulls(list){
  if(list.length>10)return showPullsList(list);
  res();
  const ord=['R','SR','SSR','UR'],best=list.reduce((b,o)=>Math.max(b,ord.indexOf(C[o.k].r)),0);
  const el=document.createElement('div');el.className='gx hold b-'+ord[best];
  el.innerHTML=`<div class="gxBg"></div><div class="gxFlash"></div>
   <div class="gxTop"><span>${list.length>1?'十 连 抽':'单 抽'}</span><button data-gx="skip">跳过 ⏭</button></div>
   <div class="gxOrb" data-gx="open"><i></i><b>点击开卡</b></div>
   <div class="gxGrid n${list.length} hide">${list.map((o,i)=>`<div class="gxc ${C[o.k].r}" data-gi="${i}" style="animation-delay:${i*70}ms"><div class="gxIn"><div class="gxBack"><span>剧</span></div><div class="gxFace">${cardHTML(o.k,o.isNew)}</div></div></div>`).join('')}</div>
   <div class="gxCut hide" data-gx="cont"></div>
   <div class="gxEnd hide"><button class="pri" data-gx="again">${list.length>1?'再来十连':'再抽一次'}</button><button data-gx="ok">好</button></div>`;
  document.body.appendChild(el);
  GX={el,list,i:0,phase:'orb',t:[],wait:false};
  // 蓄力一下再显出最高稀有度的颜色
  GX.t.push(setTimeout(()=>el.classList.remove('hold'),650));
  el.addEventListener('click',gxClick);
}
function gxAfter(ms,f){GX.t.push(setTimeout(f,ms))}
function gxClick(e){
  e.stopPropagation();if(!GX)return;
  const a=e.target.closest('[data-gx]')?.dataset.gx;
  if(a==='skip')return gxSkip();
  if(a==='ok')return gxClose(false);
  if(a==='again')return gxClose(true);
  if(GX.phase==='orb')return gxOpen();
  if(GX.phase==='cut')return gxCont();
  const c=e.target.closest('.gxc');if(c&&GX.phase==='flip'&&!c.classList.contains('open'))gxFlipNext(true);
}
function gxOpen(){GX.phase='deal';GX.el.classList.remove('hold');GX.el.classList.add('burst');
  gxAfter(520,()=>{GX.el.querySelector('.gxOrb').classList.add('hide');GX.el.querySelector('.gxGrid').classList.remove('hide')});
  gxAfter(520+GX.list.length*70+450,()=>{GX.phase='flip';gxFlipNext()})}
function gxFlipNext(now){
  if(!GX||GX.phase!=='flip')return;
  GX.t.forEach(clearTimeout);GX.t=[];
  const i=GX.i;if(i>=GX.list.length)return gxEnd();
  const o=GX.list[i],r=C[o.k].r,c=GX.el.querySelector(`[data-gi="${i}"]`);
  const big=r==='SSR'||r==='UR';
  // 金卡先抖一下再翻
  const flip=()=>{c.classList.add('open');GX.i++;
    if(big)gxAfter(420,()=>gxCut(o));else gxAfter(GX.list.length>1?160:500,()=>gxFlipNext())};
  if(big&&!now){c.animate([{transform:'scale(1)'},{transform:'scale(1.12) rotate(-3deg)'},{transform:'scale(1.12) rotate(3deg)'},{transform:'scale(1)'}],{duration:520});gxAfter(520,flip)}else flip();
}
function gxCut(o){
  const c=C[o.k],cc=c.r==='UR'?'#ff5a6e':'#e7b24a',cut=GX.el.querySelector('.gxCut');
  GX.phase='cut';
  cut.style.setProperty('--cc',cc);
  cut.innerHTML=`${av(c.look,o.k)}<div class="gxInfo"><div class="gxR">${c.r}</div><div class="gxN">${esc(c.n)}</div><div class="gxB">${esc(BOOKS[c.b]||'')} · ${esc(c.role)}</div>${c.lines&&c.lines[0]?`<div class="gxL">「${esc(c.lines[0])}」</div>`:''}${o.isNew?'<div class="gxNew">NEW</div>':''}</div><div class="gxTap">点击继续</div>`;
  cut.classList.remove('hide');
  GX.el.classList.remove('burst');void GX.el.offsetWidth;GX.el.classList.add('burst');
}
function gxCont(){GX.el.querySelector('.gxCut').classList.add('hide');GX.phase='flip';gxAfter(150,()=>gxFlipNext())}
function gxSkip(){if(!GX)return;GX.t.forEach(clearTimeout);GX.t=[];
  GX.el.classList.remove('hold');GX.el.querySelector('.gxOrb').classList.add('hide');GX.el.querySelector('.gxCut').classList.add('hide');
  const g=GX.el.querySelector('.gxGrid');g.classList.remove('hide');g.querySelectorAll('.gxc').forEach(c=>{c.style.animation='none';c.classList.add('open')});
  GX.i=GX.list.length;gxEnd()}
function gxEnd(){GX.phase='end';GX.el.querySelector('[data-gx="skip"]').classList.add('hide');GX.el.querySelector('.gxEnd').classList.remove('hide');
  const again=GX.el.querySelector('[data-gx="again"]'),need=GX.list.length>1?10:1;if(S.tickets<need){again.disabled=true;again.textContent='抽卡券不够'}}
function gxClose(again){if(!GX)return;const n=GX.list.length;GX.t.forEach(clearTimeout);GX.el.remove();GX=null;
  if(tab==='gacha')go('gacha');
  if(again){const need=n>1?10:1;if(S.tickets>=need){S.tickets-=need;doPulls(need,null,false)}}}
function showPullsList(list){
  modal(`<h2 style="margin-bottom:12px">抽卡结果</h2><div class="cards gres">${list.map((o,i)=>cardHTML(o.k,o.isNew).replace('class="ccard','style="animation-delay:'+(i*60)+'ms" class="ccard')).join('')}</div>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="pri" data-close>好</button></div>`);
  res();
}
function cardHTML(k,isNew,extra=''){
  const c=C[k],s=star(k);
  return `<div class="ccard ${c.r}${isNew?' new':''} ${extra}" data-k="${k}"><span class="tag">${c.r}</span>${av(c.look,k)}<div class="n">${esc(c.n)}</div><div class="s">${s?'★'.repeat(s):'未获得'}</div></div>`;
}
const RORD={UR:0,SSR:1,SR:2,R:3};
function byBook(keys,extra){return Object.keys(BOOKS).map(b=>{const ks=keys.filter(k=>C[k].b===b).sort((x,y)=>RORD[C[x].r]-RORD[C[y].r]);if(!ks.length)return '';const own=ks.filter(k=>S.own[k]).length;return `<h3 class="bk">${esc(BOOKS[b])} <span class="mut">${own}/${ks.length}</span></h3><div class="cards">${ks.map(k=>cardHTML(k,false,extra(k))).join('')}</div>`}).join('')}
function gacha(){
  $('#main').innerHTML=`<div class="panel">
   <h2>全角色卡池</h2><p class="mut">R 60% · SR 30% · SSR 9% · UR 1%。每 10 抽保底一张 SR 以上。重复的角色用来升星（累计 1/3/6/10/15 张 = 1~5 星）。</p>
   <div class="row"><button class="pri" id="p1" ${S.tickets<1?'disabled':''}>单抽（1 券）</button><button class="pri" id="p10" ${S.tickets<10?'disabled':''}>十连（10 券）</button>
   <span class="mut">距保底还有 ${10-S.pity} 抽</span></div></div>
   ${byBook(KEYS,k=>S.own[k]?'':'lock')}`;
}

/* ================= 布阵 ================= */
let selCell=null;
function synergies(keys){
  const out=[];
  TRAITS.forEach(t=>{const n=keys.filter(t.test).length;let lv=0;t.lv.forEach((x,i)=>{if(n>=x)lv=i+1});out.push({t,n,lv})});
  return out;
}
function team(){
  const keys=S.team.map(x=>x.k);
  const syn=synergies(keys);
  const cps=CP.filter(p=>keys.includes(p.a)&&keys.includes(p.b));
  const kin=KIN.filter(p=>keys.includes(p.a)&&keys.includes(p.b));
  const cells=Array.from({length:9},(_,i)=>{const u=S.team.find(x=>x.p===i);return `<div class="cell ${selCell===i?'sel':''}" data-cell="${i}">${u?av(C[u.k].look,u.k)+`<span class="cn">${esc(C[u.k].n)}</span>`:''}</div>`}).join('');
  $('#main').innerHTML=`<div class="form">
   <div><h2 style="margin-bottom:8px">阵容 ${S.team.length}/${MAXTEAM}</h2>
    <div class="grid3">${cells}</div><div class="collab"><span>后排</span><span>中排</span><span>前排 →</span></div>
    <p class="mut">点格子选位置，再点下面的角色放上去；点已上阵的角色把他撤下。右边一列离敌人最近。</p>
    <div class="syn"><h3 style="margin:12px 0 8px">羁绊</h3>${syn.filter(o=>o.n).map(o=>`<div class="${o.lv?'':'off'}"><b>${esc(o.t.n)}</b> ${o.n}/${o.t.lv.join('/')} — ${esc(o.lv?o.t.d[o.lv-1]:o.t.d[0])}</div>`).join('')}
    <h3 style="margin:12px 0 8px">CP 技 / 亲情</h3>${cps.map(p=>`<div>💞 <b>${esc(p.n)}</b>：${esc(p.d)}</div>`).join('')}${kin.map(p=>`<div>🫂 <b>${esc(p.n)}</b>：${esc(p.d)}</div>`).join('')}${!cps.length&&!kin.length?'<div class="off">让 CP 或亲人同时上阵，就会解锁</div>':''}</div>
   </div>
   <button class="toForm" onclick="scrollTo({top:0,behavior:'smooth'})">⬆ 阵容 ${S.team.length}/${MAXTEAM}</button>
   <div><h2 style="margin-bottom:8px">我的角色</h2>${byBook(Object.keys(S.own).filter(k=>C[k]),k=>keys.includes(k)?'on':'')}</div>
  </div>`;
}
addEventListener('scroll',()=>{const b=document.querySelector('.toForm'),g=document.querySelector('.grid3');if(b&&g)b.classList.toggle('show',g.getBoundingClientRect().bottom<0)},{passive:true});
function teamPick(k){
  const i=S.team.findIndex(x=>x.k===k);
  if(i>=0){S.team.splice(i,1)}
  else{
    if(S.team.length>=MAXTEAM){toast('最多上阵 '+MAXTEAM+' 人');return}
    let p=selCell;
    if(p==null||S.team.some(x=>x.p===p)){const pref=C[k].rng==='m'?[2,5,8,1,4,7,0,3,6]:[0,3,6,1,4,7,2,5,8];p=pref.find(q=>!S.team.some(x=>x.p===q))}
    S.team.push({k,p});selCell=null;
  }
  save();team();
}

/* ================= 战斗 ================= */
let battle=null;
function mkUnit(base,side,pos,lvMul,key){
  const u={key,side,pos,n:base.n,look:base.look,rng:base.rng,ass:!!base.ass,boss:!!base.boss,
    mhp:base.hp*lvMul,atk:base.atk*lvMul,arm:base.arm,as:base.as,mmp:base.mp,mp:0,
    dodge:base.dodge||0,crit:base.crit||0,taken:1,healAmp:1,ls:0,skm:lvMul,
    hp:0,sh:0,cd:Math.random()*.4,alive:true,st:{},buffs:[],stacks:0,flags:{},heal:!!base.heal,exec:!!base.exec,pass:base.pass||{},hits:0};
  u.hp=u.mhp;return u;
}
function col(u){return u.pos%3} // 0 后 1 中 2 前（敌方镜像后同样）
function foes(u){return battle.units.filter(x=>x.side!==u.side&&x.alive)}
function allies(u){return battle.units.filter(x=>x.side===u.side&&x.alive)}
function targetable(list){const t=list.filter(x=>!(x.st.jail>0));return t.length?t:list}
function pickTarget(u){
  let fs=targetable(foes(u));if(!fs.length)return null;
  const taunt=fs.find(x=>x.st.taunt>0);if(taunt)return taunt;
  const row=Math.floor(u.pos/3);
  const sorted=fs.slice().sort((a,b)=>u.ass?(col(a)-col(b)):(col(b)-col(a))||Math.abs(Math.floor(a.pos/3)-row)-Math.abs(Math.floor(b.pos/3)-row));
  return sorted[0];
}
function log(t){const b=$('#blog');if(!b)return;b.insertAdjacentHTML('afterbegin',`<div>${esc(t)}</div>`)}
function atkOf(u){let a=u.atk;u.buffs.forEach(b=>{if(b.atk)a*=Math.max(.2,1+b.atk)});if(u.flags.rage&&u.hp<u.mhp*.5)a*=1.3;return a}
function asOf(u){let s=1;u.buffs.forEach(b=>{if(b.as)s*=Math.max(.3,1+b.as)});if(u.key==='delila')s*=1+Math.min(.5,u.stacks*.05);return u.as/s}
function dmg(src,t,amount,magic,quiet){
  if(!t.alive)return 0;
  if(t.st.inv>0){fx(t,'无敌','#ddd');return 0}
  let d=amount;
  if(!magic){let ar=t.arm+(t.armB||0);t.buffs.forEach(b=>{if(b.arm)ar+=b.arm});d*=100/(100+Math.max(0,ar));if(t.pass.meleeRed&&src&&src.rng==='m')d*=1-t.pass.meleeRed}
  if(t.pass.armStack&&src)t.armB=Math.min(40,(t.armB||0)+1);
  if(t.pass.wrath&&src&&++t.hits===10){t.buffs.push({atk:1,t:999});castFx(t,'复仇觉醒')}
  if(t.st.vuln>0)d*=1+t.vulnV;
  d*=t.taken;
  if(t.guardBy&&t.guardBy!==t&&t.guardBy.alive&&t.st.guarded>0&&!dmg.g){const half=d/2;d-=half;dmg.g=1;try{dmg(src,t.guardBy,half,true,true)}finally{dmg.g=0}}
  if(t.sh>0){const a=Math.min(t.sh,d);t.sh-=a;d-=a}
  t.hp-=d;
  if(!t.flags.tough&&t.key==='aoding'&&t.hp<t.mhp*.3&&t.hp>0){t.flags.tough=1;t.st.undying=4;castFx(t,'硬汉')}
  if(t.hp<=0&&t.pass.lastStand&&!t.flags.ls){t.flags.ls=1;t.hp=1;castFx(t,'只想活着')}
  if(t.hp<=0&&t.st.undying>0)t.hp=1;
  if(src&&src.ls&&d>0)heal(src,src,d*src.ls,true);
  t.mp=Math.min(t.mmp,t.mp+Math.min(10,d/40));
  if(!quiet)fx(t,Math.round(d),'#ff6a5a');
  if(t.hp<=0)die(t,src);
  return d;
}
function heal(src,t,amt,quiet){if(!t.alive)return;const a=amt*(src?src.healAmp:1);t.hp=Math.min(t.mhp,t.hp+a);if(!quiet)fx(t,'+'+Math.round(a),'#7ee08a')}
function shield(src,t,amt){t.sh+=amt*(src?src.healAmp:1);fx(t,'盾','#ddd')}
function die(t,src){
  if(t.flags.revive){t.flags.revive=0;t.hp=t.mhp*.3;t.dots=[];castFx(t,'时间重回');return}
  t.alive=false;t.hp=0;log(`${t.n} 倒下了`);
  if(t.pass.martyr)allies(t).forEach(a=>a.buffs.push({atk:.25,t:999}));
  if(t.pass.burst&&battle)foes(t).forEach(f=>dmg(t,f,t.atk*1.5,true));
  allies(t).forEach(a=>{if(a.pass.feed){heal(a,a,a.mhp*.25);a.buffs.push({atk:.1,t:999})}});
  if(src&&src.alive){
    if(src.key==='bernard'||src.exec)heal(src,src,src.mhp*.2);
    const B=battle.bonus[src.side];
    if(B&&B.sp&&B.sp.LM){allies(src).forEach(a=>a.buffs.push({atk:.04,t:999}))}
    if(B&&B.villain>=2)allies(src).filter(a=>a.flags.vheal).forEach(a=>heal(a,a,a.mhp*.15));
  }
}
function addDot(t,kind,dps,dur){t.dots=t.dots||[];t.dots.push({kind,dps,t:dur})}
function basic(u){
  const t=pickTarget(u);if(!t)return;
  if(u.st.blind>0){fx(u,'落空','#aaa');return}
  if(t.dodge&&Math.random()<t.dodge){fx(t,'闪避','#aaa');return}
  let d=atkOf(u);
  if(u.flags.vexec&&t.hp<t.mhp*.15&&!t.boss){fx(t,'处决','#ff3b3b');dmg(u,t,t.hp+t.sh+9999,true,true);u.mp=Math.min(u.mmp,u.mp+10);return}
  if(u.crit&&Math.random()<u.crit){d*=2;fx(t,'暴击','#ffd36a')}
  atkAnim(u,t);dmg(u,t,d,false);
  if(u.key==='delila')u.stacks++;
  if(u.silAtk>0)t.st.sil=Math.max(t.st.sil||0,1);
  u.mp=Math.min(u.mmp,u.mp+10);
  cpGain(u,3);
}
function cpGain(u,v){battle.cps.forEach(c=>{if(c.side===u.side&&(c.a===u||c.b===u))c.e+=v})}
function lowest(list){return list.slice().sort((a,b)=>a.hp/a.mhp-b.hp/b.mhp)[0]}
function topAtk(list){return list.slice().sort((a,b)=>atkOf(b)-atkOf(a))[0]}
function back(list){return list.slice().sort((a,b)=>col(a)-col(b))[0]}
function front(list){const m=Math.max(...list.map(col));return list.filter(x=>col(x)===m)}
function skill(u){
  const m=u.skm,fs=targetable(foes(u)),al=allies(u);if(!fs.length)return;
  u.mp=0;cpGain(u,15);
  if(u.key&&C[u.key].fx){castFx(u,C[u.key].sk);runFx(u,C[u.key].fx);return}
  switch(u.key){
    case 'chengzouliu':{const t=al.find(a=>a.key==='chengyuhuai')||topAtk(al);castFx(u,'哥哥看我');shield(u,t,150*m);t.mp=Math.min(t.mmp,t.mp+30);break}
    case 'yisa':{const t=back(fs);castFx(u,'蛇系突袭');dmg(u,t,atkOf(u)*1.5,false);addDot(t,'毒',40*m,4);break}
    case 'miaohongmo':{castFx(u,'手术刀');heal(u,lowest(al),180*m);addDot(pickTarget(u)||fs[0],'血',25*m,4);break}
    case 'aqi':{const t=pickTarget(u);castFx(u,'偷天换日');const got=t.sh;t.sh=0;const bs=t.buffs.filter(b=>b.atk>0||b.as>0);t.buffs=t.buffs.filter(b=>!bs.includes(b));const to=al.find(a=>a.key==='delila')||u;to.sh+=got;to.buffs.push(...bs);dmg(u,t,atkOf(u)*1.5,false);break}
    case 'jiangbojia':{castFx(u,'军火报价单');if((u.flags.quote||0)<2){u.flags.quote=(u.flags.quote||0)+1;al.forEach(a=>a.buffs.push({atk:.12,t:999}))}const t=pickTarget(u);t.st.sil=2;dmg(u,t,atkOf(u)*1.2,false);break}
    case 'xiaoxuyan':{const t=al.find(a=>a.key==='jiangbojia'&&a!==u)||lowest(al.filter(a=>a!==u).length?al.filter(a=>a!==u):al);castFx(u,'好舅舅');shield(u,t,400*m);if(t!==u){t.guardBy=u;t.st.guarded=4}break}
    case 'delila':{const t=pickTarget(u);castFx(u,'疯批杀女');for(let i=0;i<5;i++)setTimeout(()=>{if(battle&&u.alive&&t.alive)dmg(u,t,atkOf(u)*.8,false)},i*90);break}
    case 'chengyuhuai':{castFx(u,'独家报道');fs.forEach(f=>{f.st.vuln=4;f.vulnV=Math.max(f.vulnV||0,.2)});dmg(u,topAtk(fs),300*m,true);break}
    case 'qiangqingci':{
      if(star('qiangqingci')>=3&&u.side==='p'&&!u.flags.rifa){u.flags.rifa=1;u.n='瑞法·莱诺';u.mhp*=1.5;u.hp=u.mhp;u.atk*=1.5;castFx(u,'变身·瑞法·莱诺');break}
      if(u.flags.rifa){castFx(u,'第三根火柴');fs.forEach(f=>addDot(f,'火',40*m,5));fs.slice().sort((a,b)=>a.hp-b.hp).slice(0,3).forEach(f=>dmg(u,f,250*m,true));break}
      const t=back(fs);castFx(u,'火柴疗法');t.st.stun=1.5;addDot(t,'火',50*m,4);break}
    case 'aoding':{castFx(u,'冷笑话');front(fs).forEach(f=>{f.st.stun=Math.max(f.st.stun||0,1);dmg(u,f,atkOf(u),false)});break}
    case 'bernard':
    default:{
      if(u.exec||u.key==='bernard'){const t=fs.find(f=>f.hp<f.mhp*.2);castFx(u,'处决');if(t)dmg(u,t,t.hp+t.sh+999,true);else dmg(u,pickTarget(u),atkOf(u)*2.2,false);break}
      if(u.heal){castFx(u,'急救');heal(u,lowest(al),120*m);break}
      if(u.boss){castFx(u,'清场');fs.forEach(f=>dmg(u,f,atkOf(u)*.9,false));break}
    }
  }
}
function cpFire(c){
  const {a,b,k}=c;const fs=targetable(foes(a));if(!fs.length)return;
  castFx(a,'CP·'+k.n);
  if(k.fx){runFx(a,k.fx,b);return}
  if(k.a==='chengyuhuai'){fs.forEach(f=>{f.st.vuln=5;f.vulnV=Math.max(f.vulnV||0,.3);addDot(f,'火',60*a.skm,4)})}
  if(k.a==='delila'){a.buffs.push({atk:.4,t:5});const t=topAtk(fs);for(let i=0;i<5;i++)setTimeout(()=>{if(battle&&a.alive&&t.alive)dmg(a,t,atkOf(a)*1.5,false)},i*90)}
  if(k.a==='miaohongmo'){const t=lowest(fs);t.st.blind=3;heal(a,b,b.mhp)}
  if(k.a==='jiangbojia'){b.st.inv=2;a.buffs.push({as:1,t:5})}
}
function buildSide(list,side){ // list:[{base,pos,mul,key}]
  return list.map(o=>mkUnit(o.base,side,o.pos,o.mul,o.key));
}
function statUp(u,o){if(!o)return;if(o.hp){u.mhp*=1+o.hp;u.hp=u.mhp}if(o.atk)u.atk*=1+o.atk;if(o.arm)u.arm+=o.arm;if(o.as)u.as/=1+o.as;if(o.mp)u.mp+=o.mp;if(o.taken)u.taken*=o.taken}
function applyBonus(us,side){
  const keys=us.map(u=>u.key).filter(Boolean);
  const B={sp:{},villain:0};
  if(side==='p'){
    synergies(keys).forEach(o=>{
      if(!o.lv)return;
      if(o.t.book){const v=o.lv===2?.2:.1;us.filter(u=>o.t.test(u.key)).forEach(u=>statUp(u,{hp:v,atk:v}));if(o.lv===2)B.sp[o.t.book]=1}
      if(o.t.k==='villain'){B.villain=o.lv;us.filter(u=>o.t.test(u.key)).forEach(u=>{u.flags.rage=1;if(o.lv>=2)u.flags.vheal=1;if(o.lv>=3)u.flags.vexec=1})}
      if(o.t.k==='detective'){us.forEach(u=>u.crit+=.15)}
      if(o.t.k==='gang'){const v=o.lv===2?.3:.15;us.filter(u=>o.t.test(u.key)).forEach(u=>statUp(u,{hp:v}))}
      if(o.t.k==='kill'){us.filter(u=>o.t.test(u.key)).forEach(u=>u.crit+=.25)}
      if(o.t.k==='doc'){us.forEach(u=>u.healAmp=1.3)}
    });
    const has=k=>us.find(u=>u.key===k);
    KIN.forEach(p=>{const a=has(p.a),b=has(p.b);if(!a||!b)return;statUp(a,p.sa);statUp(b,p.sb)});
    us.forEach(u=>{if(u.key==='delila')u.flags.rage=1;if(u.pass.rage)u.flags.rage=1});
    if(B.sp.WC)us.forEach(u=>u.ls=Math.max(u.ls,.2));
    if(B.sp.RG)us.filter(u=>C[u.key].b==='RG').forEach(u=>u.flags.revive=1);
    if(B.sp.CY)us.forEach(u=>u.mp+=30);
    if(B.sp.HU){us.forEach(u=>u.crit+=.15);us.filter(u=>C[u.key].b==='HU').forEach(u=>u.mp+=30)}
    if(B.sp.SZ){us.forEach(u=>statUp(u,{hp:.12}));us.filter(u=>C[u.key].b==='SZ').forEach(u=>u.sh+=u.mhp*.15)}
    if(B.sp.WB){const wb=us.filter(u=>C[u.key].b==='WB').sort(()=>Math.random()-.5).slice(0,2);wb.forEach(u=>{u.atk*=1.4;u.crit+=.3;u.n+='·能力者'})}
  }
  return B;
}
// 通用技能效果。sel：敌方 t/back/front/all/low/top/rand2；我方 self/alow/aall/atop/partner/p:角色key
function pickSel(u,sel,partner){
  const fs=targetable(foes(u)),al=allies(u);
  switch(sel){
    case 't':return [pickTarget(u)].filter(Boolean);
    case 'back':return fs.length?[back(fs)]:[];
    case 'front':return fs.length?front(fs):[];
    case 'all':return fs;
    case 'low':return fs.length?[lowest(fs)]:[];
    case 'top':return fs.length?[topAtk(fs)]:[];
    case 'rand2':return fs.slice().sort(()=>Math.random()-.5).slice(0,2);
    case 'self':return [u];
    case 'alow':return [lowest(al)];
    case 'aall':return al;
    case 'atop':return [topAtk(al)];
    case 'partner':return partner&&partner.alive?[partner]:[];
  }
  if(sel.startsWith('p:')){const k=sel.slice(2);const a=al.find(x=>x.key===k&&x!==u);return [a||lowest(al)]}
  return [];
}
function runFx(u,list,partner){
  const m=u.skm;
  for(const f of list){
    const [op,sel,...a]=f;
    if(op==='rand'){runFx(u,rand(f.slice(1)),partner);continue}
    if(op==='hurtself'){u.hp=Math.max(1,u.hp-u.mhp*sel);continue}
    const ts=pickSel(u,sel,partner);
    ts.forEach(t=>{if(!t)return;skAnim(u,t,op);switch(op){
      case 'hit':dmg(u,t,atkOf(u)*a[0],false);break;
      case 'hits':for(let i=0;i<a[0];i++)setTimeout(()=>{if(battle&&u.alive&&t.alive)dmg(u,t,atkOf(u)*a[1],false)},i*90);break;
      case 'mag':dmg(u,t,a[0]*m,true);break;
      case 'heal':heal(u,t,a[0]*m);break;
      case 'healp':heal(u,t,t.mhp*a[0]);break;
      case 'hot':addDot(t,'愈',-a[0]*m,a[1]);break;
      case 'shield':shield(u,t,a[0]*m);break;
      case 'stun':if(!(t.st.cci>0))t.st.stun=Math.max(t.st.stun||0,a[0]*(1-(t.pass.ccRes||0)));break;
      case 'sil':if(!(t.st.cci>0))t.st.sil=Math.max(t.st.sil||0,a[0]);break;
      case 'blind':t.st.blind=Math.max(t.st.blind||0,a[0]);break;
      case 'taunt':t.st.taunt=a[0];break;
      case 'vuln':t.st.vuln=a[0];t.vulnV=Math.max(t.vulnV||0,a[1]);break;
      case 'dot':addDot(t,a[0],a[1]*m,a[2]);break;
      case 'buff':t.buffs.push({[a[0]]:a[1],t:a[2]});break;
      case 'inv':t.st.inv=a[0];break;
      case 'mp':t.mp=Math.min(t.mmp,t.mp+a[0]);break;
      case 'exec':if(t.hp<t.mhp*a[0]&&!t.boss){fx(t,'处决','#ff3b3b');dmg(u,t,t.hp+t.sh+9999,true,true)}break;
      case 'guard':if(t!==u){t.guardBy=u;t.st.guarded=a[0]}break;
      case 'pguard':if(partner&&partner.alive){t.guardBy=partner;t.st.guarded=a[0]}break;
      case 'hurt':t.hp=Math.max(1,t.hp-t.hp*a[0]);break;
      case 'cleanse':t.st.stun=0;t.st.sil=0;t.st.blind=0;t.st.cci=2;break;
    }});
  }
}
function startBattle(st){stopLobby();
  const pl=S.team.map(t=>({base:C[t.k],pos:t.p,mul:STAR_M[star(t.k)-1]||1,key:t.k}));
  if(!pl.length){toast('先去布阵');return}
  const epos=[2,5,8,1,4,7,0,3,6];
  const en=st.en.map((k,i)=>{const b=E[k];const p=b.rng==='m'||b.boss?[2,5,8][i%3]:[0,3,6][i%3];return {base:b,pos:p,mul:st.sc,key:null}});
  // 去重位置

function tick(dt){

  if(b.bonus.p.sp.LZ)b.units.forEach(u=>{if(u.side==='p'&&u.alive)u.hp=Math.min(u.mhp,u.hp+u.mhp*.02*dt)});
  if(b.bonus.p.sp.LM){
    const P=b.units.filter(u=>u.side==='p'),N=b.units.filter(u=>u.side==='e'&&u.alive);
    if(!b.acts[2]&&b.t>=8){b.acts[2]=1;log('第二幕·火柴疗法');N.forEach(n=>addDot(n,'火',40,4))}
    if(!b.acts[3]&&b.t>=16&&N.length){b.acts[3]=1;const t=topAtk(N);t.st.jail=3;t.st.stun=3;log('第三幕·小黑屋：'+t.n)}

  }
  for(const u of b.units){
    if(!u.alive)continue;
    for(const k in u.st)if(u.st[k]>0)u.st[k]-=dt;
    u.buffs=u.buffs.filter(x=>(x.t-=dt)>0);
    if(u.dots){u.dots=u.dots.filter(d=>{if(d.dps<0)heal(null,u,-d.dps*dt,true);else dmg(null,u,d.dps*dt,true,true);return(d.t-=dt)>0&&u.alive});if(!u.alive)continue}
    if(u.st.stun>0)continue;
    u.cd-=dt;

      u.cd=asOf(u);
    }
  }

  battle={...b,timer:null};battle=null;res();
}

/* ================= 关卡 / 图鉴 ================= */
function stage(){
  const unlocked=id=>id===1||S.clear[id-1];
  $('#main').innerHTML=`<h2 style="margin-bottom:6px">第一章 · 流氓叙事</h2><p class="mut">首通奖励 1 张抽卡券（首领关 3 张），首次三星再加 1 张。无人阵亡三星，阵亡一人两星。</p>
  <div class="stages">${STAGES.map(s=>`<button class="stage ${s.boss?'boss':''}" data-st="${s.id}" ${unlocked(s.id)?'':'disabled'}><div class="mut">第 ${s.id} 关${s.boss?' · 首领':''}</div><div><b>${esc(s.n)}</b></div><div class="st">${S.clear[s.id]?'★'.repeat(S.clear[s.id]):unlocked(s.id)?'未通关':'🔒'}</div></button>`).join('')}</div>
  <p class="mut" style="margin-top:16px">更多章节（温床、绿洲、如故、窃云台、如果长夜无明、王不见王……）后续开放。</p>`;
}
function book(){
  $('#main').innerHTML=`<h2 style="margin-bottom:10px">角色图鉴 <span class="mut">${Object.keys(S.own).length}/${KEYS.length}</span></h2>${byBook(KEYS,k=>S.own[k]?'':'lock')}<p class="mut" style="margin-top:12px">点角色看技能。头像是占位图，正式立绘之后替换。</p>`;
}
function detail(k){
  const c=C[k],s=star(k),m=STAR_M[Math.max(0,s-1)];
  const cps=CP.filter(p=>p.a===k||p.b===k).map(p=>`💞 ${esc(p.n)}（和${esc(C[p.a===k?p.b:p.a].n)}）：${esc(p.d)}`);
  const kin=KIN.filter(p=>p.a===k||p.b===k).map(p=>`🫂 ${esc(p.n)}：${esc(p.d)}`);
  modal(`<div class="det"><div>${cardHTML(k,false,S.own[k]?'':'lock')}</div><div>
   <h2>${esc(c.n)} <span class="mut">${c.r} · ${esc(BOOKS[c.b])} · ${esc(c.role)}</span></h2>
   <p>${s?'★'.repeat(s):'未获得'} ${S.own[k]?`（已有 ${S.own[k]} 张，下一星需 ${STAR_AT[s]||'—'} 张）`:''}</p>
   <p>生命 ${Math.round(c.hp*m)} · 攻击 ${Math.round(c.atk*m)} · 护甲 ${c.arm} · ${c.rng==='m'?'近战':'远程'}</p>
   <p><b style="color:var(--gold)">${esc(c.sk)}</b>：${esc(c.sd)}</p>
   ${cps.concat(kin).map(x=>`<p class="mut">${x}</p>`).join('')}
   <p class="mut">「${esc(rand(c.lines))}」</p>
   <div class="row" style="justify-content:flex-end"><button data-close>关闭</button></div></div></div>`);
}

/* ================= 事件 ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-k],[data-cell],[data-close]');if(!t)return;
  if(t.matches('[data-close]')){close();if(tab==='stage'||tab==='team'||tab==='gacha')go(tab);return}
  if(t.dataset.t){go(t.dataset.t);return}
  if(t.id==='icb'){const r=checkCode($('#ic').value);if(r&&r.kind==='invite'){S.invited=true;save();close();go('lobby');toast('欢迎来到布雷诺')}else $('#icm').textContent='邀请码不对，找发码的朋友再确认一下。';return}
  if(t.id==='rcb'){const v=$('#rc').value,r=checkCode(v);
    if(!r||r.kind!=='redeem'){$('#rcm').textContent='这不是有效的兑换码。';return}
    if(S.used.includes(r.code)){$('#rcm').textContent='这个码已经在这台设备上用过了。';return}
    if(r.book==='CS'){S.used.push(r.code);KEYS.forEach(k=>S.own[k]=Math.max(S.own[k]||0,6));S.tickets+=100;save();res();toast('测试码：已解锁全部角色（3 星）+100 抽卡券');lobby();return}
    S.used.push(r.code);save();doPulls(100,BOOKS[r.book]?r.book:null,true);return}
  if(t.id==='swap'){const n=Math.min(Math.floor(S.clues/100),swapLeft());if(n>0){S.clues-=n*100;S.tickets+=n;S.swapN=(S.swapDay===today()?S.swapN:0)+n;S.swapDay=today();save();res();toast('换到 '+n+' 张抽卡券');lobby()}else toast('今天的兑换次数用完了');return}
  if(t.id==='p1'&&S.tickets>=1){S.tickets-=1;doPulls(1,null,false);return}
  if(t.id==='p10'&&S.tickets>=10){S.tickets-=10;doPulls(10,null,false);return}
  if(t.id==='spd'&&battle){battle.speed=battle.speed===1?2:battle.speed===2?4:1;t.textContent='×'+battle.speed;return}
  if(t.id==='logT'){$('#blog')&&$('#blog').classList.toggle('hide');return}
  if(t.id==='skip'&&battle){clearInterval(battle.timer);BT.fast=1;try{while(battle&&tick(.1)){}}finally{BT.fast=0}drawBattle();return}
  if(t.id==='next'){close();const nx=STAGES.find(s=>!S.clear[s.id]);if(nx)startBattle(nx);return}
  if(t.dataset.st){startBattle(STAGES[+t.dataset.st-1]);return}
  if(t.dataset.cell!=null){const i=+t.dataset.cell;const u=S.team.find(x=>x.p===i);if(u&&selCell===null){S.team=S.team.filter(x=>x!==u);save()}else if(selCell!=null&&u==null&&S.team.some(x=>x.p===selCell)){const m=S.team.find(x=>x.p===selCell);m.p=i;selCell=null;save()}else selCell=selCell===i?null:i;team();return}
  if(t.dataset.k){if(tab==='team'&&$('#modal').classList.contains('hide')&&S.own[t.dataset.k])teamPick(t.dataset.k);else detail(t.dataset.k);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ic')$('#icb').click();if(e.key==='Enter'&&e.target.id==='rc')$('#rcb').click();if(e.key==='Escape'&&!$('#modal').classList.contains('hide')&&S.invited&&!battle)close()});

window.__G={C,E,STAGES,CP,S:()=>S,setS:x=>{S=x},startBattle,tick,stopBattle,get battle(){return battle},checkCode,fnv,doPulls,star};
SpaceSave.button($('#ssBtn'));SpaceSave.onChange(()=>{loadS();res();if(!battle)go(tab)});
nav();res();
if(!S.invited){S.invited=true;save()}go('lobby');
}
</script>
</body>
</html>
