<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>兄弟自走棋 · Space</title>
<meta name="theme-color" content="#0b0716">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 酒馆桌上的战棋，暖、紧凑、有手感
   IDEA: 一张木桌上的棋盘 + 下方的商店抽屉
   PICTURE: 8x8 棋盘本身，上半敌阵，下半我方
   COLOUR and TYPE: 深胡桃木底，铜金强调，石板棋格；ZCOOL XiaoWei 标题 + Noto Sans SC
   LAYOUT: 左羁绊 / 中棋盘+备战席 / 右详情，底部商店 */
:root{color-scheme:dark;--bg:#1a120d;--wood:#2b1d14;--wood2:#3a281b;--panel:#241911;--ink:#f3e6d0;--mute:#b8a48a;--gold:#e7b34a;--red:#e0574a;--blue:#4aa3e0;--green:#59c27a;
--c1:#a9a39a;--c2:#4fc479;--c3:#3f9cf0;--c4:#c06cff;--cell:min(60px,calc((100vw - 24px)/8))}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(ellipse at 50% 30%,#3a2618 0%,var(--bg) 70%);color:var(--ink);font:15px/1.45 "Noto Sans SC",system-ui,sans-serif;min-height:100vh;user-select:none;-webkit-user-select:none;overflow-x:clip}
h1{font:400 30px/1.05 "ZCOOL XiaoWei",serif;margin:0;color:var(--gold);letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer}
#top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:center;padding:12px 12px 6px}
.stat{background:var(--panel);border:1px solid #4a3424;border-radius:10px;padding:5px 12px;white-space:nowrap}
.stat b{color:var(--gold);font-size:17px}
#hpS b{color:#ff7a6b}
.xpbar{display:inline-block;width:60px;height:6px;background:#00000066;border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--blue)}
main{display:flex;gap:14px;justify-content:center;align-items:flex-start;padding:6px 12px;flex-wrap:wrap}
aside{background:var(--panel);border:1px solid #4a3424;border-radius:14px;padding:12px;width:210px}
aside h3{margin:0 0 8px;font:400 19px "ZCOOL XiaoWei",serif;color:var(--gold)}
#center{display:flex;flex-direction:column;align-items:center;gap:10px}
#boardWrap{position:relative;padding:10px;background:linear-gradient(#4a321f,#2e1f14);border-radius:14px;box-shadow:0 18px 40px #0009,inset 0 1px 0 #ffffff22}
#board{position:relative;width:calc(var(--cell)*8);height:calc(var(--cell)*8)}
#cells{display:grid;grid-template-columns:repeat(8,var(--cell));grid-template-rows:repeat(8,var(--cell))}
.cell{background:#4b4a42}.cell.alt{background:#424139}
.cell.en{background:#4d3b3a}.cell.en.alt{background:#45343a}
.cell.ok:hover,.cell.hl{box-shadow:inset 0 0 0 2px var(--gold)}
#mid{position:absolute;left:0;right:0;top:calc(var(--cell)*4 - 1px);height:2px;background:#e7b34a55}
#layer{position:absolute;inset:0;pointer-events:none}
.unit{position:absolute;width:var(--cell);height:var(--cell);pointer-events:auto;cursor:grab;transition:left .22s linear,top .22s linear,opacity .4s}
.tok{position:absolute;left:8%;top:10%;width:84%;height:76%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#5d5246,#2a221b);border:3px solid var(--c1);box-shadow:0 4px 0 #0007}
.c2 .tok{border-color:var(--c2)}.c3 .tok{border-color:var(--c3)}.c4 .tok{border-color:var(--c4)}
.enemy .tok{background:radial-gradient(circle at 35% 30%,#6a3a35,#2a1513);outline:2px solid var(--red);outline-offset:1px}
.emo{font-size:calc(var(--cell)*.42);line-height:1;filter:drop-shadow(0 2px 1px #0008)}
.stars{position:absolute;top:-2px;left:0;right:0;text-align:center;font-size:11px;color:var(--gold);text-shadow:0 1px 2px #000;z-index:2;letter-spacing:-1px}
.unit.sel .tok{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold)}
.unit.preview{opacity:.75;cursor:default}
.bars{position:absolute;left:8%;right:8%;bottom:1px;display:grid;gap:1px}
.hpb,.mpb{height:5px;background:#000a;border-radius:2px;overflow:hidden;position:relative}
.mpb{height:3px}
.hpb i{position:absolute;inset:0 auto 0 0;background:var(--green)}
.enemy .hpb i{background:var(--red)}
.hpb s{position:absolute;inset:0 auto 0 0;background:#fff;opacity:.85;text-decoration:none}
.mpb i{position:absolute;inset:0 auto 0 0;background:var(--blue)}
.unit.stun .tok{filter:grayscale(.7) brightness(.8)}
.unit.stun::after{content:"💫";position:absolute;right:0;top:0;font-size:14px}
.unit.dead{opacity:0;pointer-events:none}
.unit.hit .tok{animation:hit .18s}
@keyframes hit{50%{transform:translateX(3px);filter:brightness(1.8)}}
.float{position:absolute;pointer-events:none;font-weight:900;font-size:14px;text-shadow:0 1px 2px #000,0 0 3px #000;animation:up .8s ease-out forwards;white-space:nowrap;transform:translateX(-50%);z-index:5}
.float.heal{color:#7dffa0}.float.crit{color:#ffcf4a;font-size:18px}.float.skill{color:#9fd4ff;font-size:13px}.float.miss{color:#ccc;font-size:12px}
@keyframes up{to{transform:translate(-50%,-30px);opacity:0}}
.proj{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#ffe9a0;box-shadow:0 0 8px #ffd34a;transition:left .18s linear,top .18s linear;pointer-events:none;z-index:4}
.proj.magic{background:#a8d8ff;box-shadow:0 0 10px #4aa3e0;width:12px;height:12px;margin:-6px 0 0 -6px}
#bench{display:grid;grid-template-columns:repeat(8,var(--cell));gap:0;padding:8px 10px;background:var(--wood2);border-radius:12px;box-shadow:inset 0 2px 6px #0008}
.slot{position:relative;width:var(--cell);height:var(--cell);border:1px dashed #6b5340;border-radius:8px;background:#00000022}
.slot .unit{position:absolute;left:0;top:0}
#banner{font:400 26px "ZCOOL XiaoWei",serif;color:var(--gold);min-height:32px;text-align:center}
#banner.boss{color:#ff7a6b}
.syn{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;padding:6px 6px;border-radius:8px;margin-bottom:4px;opacity:.55}
.syn.on{opacity:1;background:#e7b34a1c}
.syn .n{font-weight:700}.syn .k{color:var(--mute);font-size:12px}
.syn .d{grid-column:1/-1;font-size:12px;color:var(--mute)}
.syn.on .d{color:var(--ink)}
.syn .pips span{display:inline-block;padding:0 5px;border-radius:4px;font-size:12px;background:#00000055;margin-left:2px}
.syn .pips span.a{background:var(--gold);color:#2b1d14;font-weight:700}
#info .big{font-size:44px;text-align:center}
#info .nm{text-align:center;font-weight:900;font-size:17px}
#info table{width:100%;font-size:13px;border-collapse:collapse;margin:8px 0}
#info td{padding:2px 0}#info td:last-child{text-align:right;color:var(--gold)}
.tags{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;padding:1px 7px;border-radius:10px;background:#00000055;border:1px solid #5a4330}
.sk{font-size:13px;background:#00000040;border-radius:8px;padding:8px;color:var(--ink)}
.sk b{color:#9fd4ff}
.help{font-size:13px;color:var(--mute);line-height:1.6}
.help kbd{background:#000;border:1px solid #555;border-radius:4px;padding:0 5px;font-size:12px;color:var(--ink)}
footer{padding:10px 12px 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
#controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid #6b5340;background:linear-gradient(#4a3424,#33241a);font-weight:700;box-shadow:0 3px 0 #0008}
.btn:hover:not(:disabled){filter:brightness(1.2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.fight{background:linear-gradient(#c2472f,#8a2a1b);border-color:#ff8a6b;font-size:17px;padding:8px 26px}
.btn.on{background:linear-gradient(#e7b34a,#a87a24);color:#2b1d14}
#shop{display:grid;grid-template-columns:repeat(5,minmax(0,128px));gap:8px;padding:10px;background:var(--wood);border-radius:14px;border:1px solid #4a3424;box-shadow:0 10px 30px #0007;max-width:100%}
#shop.sellzone{outline:3px dashed var(--gold)}
.card{position:relative;border-radius:10px;padding:8px 6px 6px;text-align:center;cursor:pointer;background:linear-gradient(#3d2c1f,#271b12);border:2px solid var(--c1);min-height:112px;transition:transform .12s}
.card:hover{transform:translateY(-3px)}
.card.c2{border-color:var(--c2)}.card.c3{border-color:var(--c3)}.card.c4{border-color:var(--c4)}
.card.empty{border-style:dashed;opacity:.3;cursor:default}
.card .e{font-size:34px;line-height:1.1}
.card .n{font-weight:700;font-size:14px}
.card .t{font-size:11px;color:var(--mute)}
.card .p{position:absolute;top:4px;right:6px;color:var(--gold);font-weight:900;font-size:13px}
.card.poor{filter:grayscale(.8)}
.card.pair::after{content:"↑";position:absolute;top:2px;left:6px;color:var(--gold);font-weight:900;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#000c;border:1px solid var(--gold);padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
#overlay{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:40}
#overlay.show{display:grid}
.modal{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:28px 34px;text-align:center;max-width:90vw}
.modal h2{font:400 38px "ZCOOL XiaoWei",serif;color:var(--gold);margin:0 0 8px}
.ghost{position:fixed;pointer-events:none;z-index:60;width:var(--cell);height:var(--cell);transform:translate(-50%,-50%) scale(1.1)}
@media(max-width:900px){aside{width:min(100%,560px)}#syn{order:2}#info{order:3}#center{order:1}}
@media(max-width:600px),(max-width:1100px) and (orientation:portrait){#shop{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:6px}.card{min-height:96px;padding:6px 2px}.card .e{font-size:26px}.card .n{font-size:12px}.card .t{display:none}h1{font-size:24px}.btn{padding:6px 10px;font-size:14px}}
@media(prefers-reduced-motion:reduce){.unit,.proj{transition:none}.float,.card.pair::after{animation:none}}
.tok{overflow:hidden;background:#1a1020}
.tok img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.nmt{position:absolute;left:0;right:0;bottom:-3px;text-align:center;font-size:10px;font-weight:700;text-shadow:0 1px 2px #000,0 0 2px #000;pointer-events:none;white-space:nowrap;z-index:2}
.unit:has(.bars) .nmt{display:none}
.tok{border-radius:14px}
.unit.marked::before{content:"🔪";position:absolute;left:-2px;top:-4px;font-size:15px;z-index:3}
.unit.burn .tok{box-shadow:0 0 10px #ff6a2a}
.proj.pill{background:#ff7ad9;box-shadow:0 0 8px #ff4fc6}
.card img.e{width:56px;height:56px;border-radius:10px;object-fit:cover;display:block;margin:4px auto 2px}
#info img.big{width:110px;height:110px;border-radius:16px;object-fit:cover;display:block;margin:0 auto 6px;border:2px solid #6b5340}
@media(max-width:600px),(max-width:1100px) and (orientation:portrait){.card img.e{width:42px;height:42px}}

/* ===== 2.5D neon KTV skin ===== */
:root{--bg:#0b0716;--wood:#160f2a;--wood2:#1b1233;--panel:rgba(20,13,40,.82);--ink:#f4ecff;--mute:#a99cc7;--gold:#ffc85a;
  --pink:#ff4fb8;--cyan:#38e1ff;--c1:#b9b4c8;--c2:#4fe08a;--c3:#4fb4ff;--c4:#d58bff;--line:#3b2a66;
  --cell:min(60px,calc((100vw - 24px)/8/1.25))}
body{background:#07040f url(autochess/bg.webp?v=1) center top/cover fixed;position:relative}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(10,5,25,.35),rgba(6,3,14,.88) 75%);pointer-events:none;z-index:0}
#top,main,footer{position:relative;z-index:1}
html{overflow-x:hidden}body{overflow-x:hidden}#center{max-width:100vw;overflow-x:clip;overflow-y:visible;padding-top:4px}
h1{font:400 34px/1.05 "ZCOOL XiaoWei",serif;background:linear-gradient(90deg,#ffd36e,#ff6fc8 60%,#7fe7ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #ff4fb866)}
.stat{background:linear-gradient(180deg,rgba(40,26,78,.85),rgba(18,11,38,.85));border:1px solid #5a3f99;border-radius:999px;box-shadow:0 0 0 1px #00000055 inset,0 6px 18px #0007;backdrop-filter:blur(6px)}
.stat b{color:var(--gold);text-shadow:0 0 8px #ffb84a88}
.xpbar{background:#0008}.xpbar i{background:linear-gradient(90deg,#38e1ff,#7f8bff)}
aside{background:var(--panel);border:1px solid #4a3585;border-radius:16px;backdrop-filter:blur(8px);box-shadow:0 10px 30px #0008}
aside h3{color:var(--gold)}
.syn.on{background:linear-gradient(90deg,#ffc85a26,#ff4fb814);box-shadow:inset 3px 0 0 var(--gold)}
.syn .pips span.a{background:linear-gradient(#ffe08a,#e8a32e);color:#2a1606}
.tag{background:#0006;border-color:#5a3f99}
.sk{background:#0007;border:1px solid #3d2b6e}

/* stage + projected board */
#boardWrap{padding:0;background:none;box-shadow:none;border-radius:0}
#board{perspective:var(--persp,520px);perspective-origin:50% 50%}
#cells{transform:rotateX(var(--tilt,42deg));transform-origin:50% 50%;border-radius:10px;
  box-shadow:0 0 0 2px #7a4dff88,0 0 40px #ff4fb855,0 22px 0 #140a2a,0 22px 0 2px #7a4dff55,0 40px 60px #000c}
.cell{background:linear-gradient(135deg,#1f2a4a,#172038);box-shadow:inset 0 0 0 1px #38e1ff22;transition:background .15s}
.cell.alt{background:linear-gradient(135deg,#1a2442,#121a30)}
.cell.en{background:linear-gradient(135deg,#3a1838,#2b1230);box-shadow:inset 0 0 0 1px #ff4fb822}
.cell.en.alt{background:linear-gradient(135deg,#331433,#240f29)}
.cell.ok:hover,.cell.hl{background:linear-gradient(135deg,#2b5a7a,#1b3c5a);box-shadow:inset 0 0 0 2px var(--cyan),inset 0 0 18px #38e1ff88}
body.dragging .cell.ok{box-shadow:inset 0 0 0 1px #38e1ff66,inset 0 0 10px #38e1ff33}
#mid{display:none}
#cells::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);height:3px;background:linear-gradient(90deg,transparent,#ffc85a,#ff4fb8,#ffc85a,transparent);box-shadow:0 0 14px #ffc85a;pointer-events:none}
#cells{position:relative}
#layer{overflow:visible}
#fx{position:absolute;pointer-events:none;z-index:900}

/* units = upright sprites anchored at their feet */
.unit{width:0;height:0;--s:1;cursor:grab;transition:left .26s cubic-bezier(.3,.7,.4,1),top .26s cubic-bezier(.3,.7,.4,1),opacity .5s}
.fig{position:absolute;left:0;top:0;width:calc(var(--cell)*1.7);height:calc(var(--cell)*2.05);transform:translate(-50%,-100%) scale(var(--s));transform-origin:50% 100%;pointer-events:none}
.fig>*{pointer-events:none}
.hitbox{position:absolute;left:18%;right:18%;top:12%;bottom:0;pointer-events:auto}
.shadow{position:absolute;left:50%;bottom:-9%;width:78%;height:22%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.65),rgba(0,0,0,0) 70%)}
.shadow::after{content:"";position:absolute;inset:8% 6%;border-radius:50%;border:2px solid var(--cyan);box-shadow:0 0 10px var(--cyan),inset 0 0 8px var(--cyan);opacity:.85}
.enemy .shadow::after{border-color:#ff4f6e;box-shadow:0 0 10px #ff4f6e,inset 0 0 8px #ff4f6e}
.face{position:absolute;inset:0;transition:transform .15s}
.flip .face{transform:scaleX(-1)}
.bob{position:absolute;inset:0;animation:idle 2.4s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:50% 100%}
@keyframes idle{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2.5%) scaleY(1.015)}}
.spr{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 0 1px #000) drop-shadow(0 3px 4px #0009)}
.c2 .spr{filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 5px #4fe08a99)}
.c3 .spr{filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 6px #4fb4ffaa)}
.s2 .spr{filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 6px #e8eefc) drop-shadow(0 0 12px #9fc4ff88)}
.s3 .spr{filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 6px #ffd36e) drop-shadow(0 0 16px #ffb84acc);animation:gold 1.6s ease-in-out infinite}
@keyframes gold{50%{filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 9px #ffe08a) drop-shadow(0 0 22px #ffb84a)}}
.stars{position:absolute;top:-6%;left:0;right:0;font-size:calc(var(--cell)*.24);letter-spacing:0;color:#ffd36e;text-shadow:0 0 6px #ffb84a,0 1px 2px #000}
.s1 .stars{color:#d8d4e8;text-shadow:0 1px 2px #000}
.nmt{bottom:auto;top:-18%;font-size:11px;color:#fff;opacity:0;transition:opacity .15s}
.unit:hover .nmt,.unit.sel .nmt,.slot .nmt{opacity:1}
.slot .nmt{top:auto;bottom:-4px}
.bars{position:absolute;left:14%;right:14%;top:-14%;bottom:auto;gap:1px;z-index:3}
.bars+.nmt{display:none}
.hpb{height:6px;border:1px solid #000;border-radius:3px;background:#000c}
.hpb i{background:linear-gradient(#7dffb0,#2ec46a)}.enemy .hpb i{background:linear-gradient(#ff8a8a,#e0344a)}
.hpb s{background:#fff;opacity:.9}
.mpb{height:3px;border-radius:2px}.mpb i{background:linear-gradient(90deg,#38e1ff,#8a7dff)}
.unit.sel .shadow::after{border-color:var(--gold);box-shadow:0 0 14px var(--gold),inset 0 0 10px var(--gold)}
.unit.sel .tok,.unit .tok{display:none}
.unit.preview{opacity:.9}
.unit.preview .spr{filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 6px #ff4f6e88) brightness(.9)}
.unit.hit .spr{animation:hitf .2s}
@keyframes hitf{40%{filter:brightness(2.4) drop-shadow(0 0 6px #fff)}}
.unit.stun .bob{animation:wob .5s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.unit.stun::after{content:"💫";position:absolute;left:0;top:calc(var(--cell)*-2.15*var(--s));transform:translateX(-50%);font-size:18px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.unit.dead{opacity:0}
.unit.dead .fig{transform:translate(-50%,-100%) scale(var(--s)) translateY(12%) rotate(-8deg);transition:transform .5s}
.unit.marked::before{content:"🔪";left:0;top:calc(var(--cell)*-2.35*var(--s));transform:translateX(-50%);font-size:18px;filter:drop-shadow(0 0 6px #ff3355);position:absolute;z-index:4}
.unit.burn .spr{filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 8px #ff6a2a) drop-shadow(0 -4px 10px #ff3d00aa)}
.unit.shielded .shadow::before{content:"";position:absolute;left:-6%;right:-6%;bottom:30%;height:calc(var(--cell)*1.9);border-radius:50% 50% 45% 45%;
  background:radial-gradient(ellipse at 50% 40%,#9fe8ff22,#38e1ff33 60%,#38e1ff66);border:1px solid #9fe8ffaa;box-shadow:0 0 12px #38e1ff88}
.float{font-size:15px;z-index:1000;text-shadow:0 2px 0 #000,0 0 4px #000;-webkit-text-stroke:.4px #000}
.float.crit{font-size:21px;color:#ffd84a}
.float.skill{font-size:14px;color:#b6e4ff}
.float.heal{color:#7dffa0}
.float.big{font:400 20px "ZCOOL XiaoWei",serif;color:#fff;text-shadow:0 0 10px #ff4fb8,0 0 2px #000,0 2px 0 #000;animation:upbig 1.1s ease-out forwards}
@keyframes upbig{0%{transform:translate(-50%,6px) scale(.6);opacity:0}20%{transform:translate(-50%,-6px) scale(1.15);opacity:1}100%{transform:translate(-50%,-34px) scale(1);opacity:0}}
.proj{display:none}

/* bench */
#bench{background:linear-gradient(180deg,rgba(30,20,60,.85),rgba(14,9,30,.9));border:1px solid #4a3585;box-shadow:inset 0 2px 10px #000a,0 8px 24px #0008;padding:14px 10px 6px}
.slot{border:1px solid #4a3585;background:radial-gradient(ellipse at 50% 85%,#38e1ff22,transparent 60%),#0005;border-radius:10px;overflow:visible}
.slot .unit{left:50%;top:auto;bottom:6%;width:0;height:0;position:absolute}
.slot .unit .fig{transform:translate(-50%,-100%) scale(.66)}

  $('#banner').textContent=B.murder.player?`🔪 凶手是 ${U[B.murder.player.key].n}！`:'⚔️ 战斗中';
  if(G.enemy.boss)bossIntro();else splash('开战！','#ff4fb8');
  B.f.forEach(f=>{if(f.jump){const P=feet(f);FX.burst(P,['#c48aff','#fff'],14,60,3,500)}
    if(f.u&&f.u.items.length)setTimeout(()=>FX.burst(chest(f),['#ffd36e','#ff6fc8'],6,30,3,500,-1,'star'),200)});
  draw();
  const delay=G.enemy.boss?900:0;
  B.timer=setTimeout(()=>{if(!B)return;B.timer=setInterval(()=>{let go=true;for(let i=0;i<G.speed&&go;i++)go=tick(.05);draw();if(!go){clearInterval(B.timer);const w=finale();if(w)B.timer=setTimeout(endBattle,w);else endBattle()}},50)},delay/Math.max(1,G.speed));
}
function bossIntro(){
  const bs=B.bosses;splash(bs.map(b=>U[b.key].n).join(' & '),BOSS[bs[0].key].col);
  $('#splashT').dataset.sub=bs.map(b=>U[b.key].src).join(' / ');
  FX.flash('#000',600);
  bs.forEach((b,i)=>{const sp=b.el.querySelector('.face');sp.animate([{transform:'translateY(-260px)',opacity:0},{transform:'translateY(-260px)',opacity:0,offset:.3},{transform:'translateY(8px)',opacity:1,offset:.85},{transform:'translateY(0)',opacity:1}],{duration:800,easing:'cubic-bezier(.5,0,.8,.4)'});
    setTimeout(()=>{const F=feet(b);FX.ring(F,BOSS[b.key].col,10,180*F.s,800,10);FX.burst(F,[BOSS[b.key].col,'#fff'],30,130,5,800,1);FXG.decal(F,BOSS[b.key].col+'66',60*F.s,2400,'scorch');shakeBoard();if(i===0)cutin(b,U[b.key].src)},700)});
}
function endBattle(){
  clearInterval(B.timer);clearTimeout(B.bh);document.body.classList.remove('battling');camReset();showMvp();
  const surv=alive('enemy'),win=alive('player').length>0&&!surv.length,bn=$('#banner'),T=B.tiers.player,msgs=[];
  if(win){G.streak=Math.max(1,G.streak+1);bn.textContent='🏆 胜利！';G.gold+=1+(hasHex('tip')?2:0);splash('胜利','#ffc85a');alive('player').forEach((f,i)=>{f.el.classList.remove('flip');setTimeout(()=>f.el.classList.add('cheer'),i*80)});alive('player').forEach(f=>FX.burst(chest(f),['#ffd36e','#ff6fc8','#7fe7ff'],16,90,4,1100,1,'rect'))}
  else{G.streak=Math.min(-1,G.streak-1);const d=lossDmg(G.round,surv,G.enemy.boss);
    G.hp=Math.max(0,G.hp-d);bn.textContent=`💥 失败，-${d} 生命`;splash('失败','#5a7dff')}
  // 叠层结算
  B.f.filter(f=>f.side==='player'&&f.u).forEach(f=>{const u=f.u;
    if(u.key==='kevin')u.stk=Math.min(25,(u.stk||0)+1);if(u.key==='jiuge'&&!f.dead)u.stk=Math.min(30,(u.stk||0)+1);
    if(T.rising&&has(f,'rising'))u.rise=Math.min(20,(u.rise||0)+1)});
  if(T.ancient)G.tstk.ancient++;
  if(win&&T.bar){G.tstk.bar++;if(G.tstk.bar%6===0){const g=giveItem(1);if(g.length)msgs.push(`熟客积分满 6，送 ${CK[g[0]].i}${CK[g[0]].n}`)}}
  let cleared=false;if(win&&G.enemy.final&&!G.cleared){G.cleared=true;G.clearRound=G.round;cleared=true}
  if(win&&G.enemy.boss){const bt=hasHex('bartender'),g=giveItem(2+(bt?1:0)+(G.diff==='hell'?1:0),bt||G.enemy.idx%7>=2);G.bossesBeaten++;
    if(g.length){msgs.push(`首领掉落：${g.map(k=>CK[k].i+CK[k].n).join('、')}`);dropFx(g)}}
  $('#hp').textContent=G.hp;G.phase='result';
  setTimeout(()=>{
    clearTimeout(B&&B.timer);B=null;$('#bossbar').classList.remove('show');if(G.hp<=0)return gameOver();
    const interest=Math.min(interestCap(),(G.gold/10)|0),s=Math.abs(G.streak),sb=(s>=6?3:s>=4?2:s>=2?1:0)*(hasHex('streak')?2:1),bg=bossGold();
    G.gold+=5+interest+sb+bg;addXp(2);G.freeRoll=hasHex('fullhouse')?1:0;
    if(!G.locked)rollShop();G.locked=false;
    G.round++;G.enemy=genEnemy(G.round);G.phase='plan';G.peek=null;
    if(HEX_ROUNDS.includes(G.round))offerHex();
    render();if(cleared)showClear();
    toast(`收入 +${5+interest+sb+bg}（基础5 · 利息${interest} · 连胜/败${sb}${bg?' · 老板'+bg:''}）`+(msgs.length?'　'+msgs.join('　'):''));
  },1900);
}
function dropFx(list){
  const bar=$('#itembar').getBoundingClientRect(),bd=$('#board').getBoundingClientRect();
  list.forEach((k,i)=>{const d=document.createElement('div');d.className='dropD';d.textContent=CK[k].i;document.body.appendChild(d);
    const sx=bd.left+bd.width/2,sy=bd.top+bd.height*.3,ex=bar.left+60+i*44,ey=bar.top+bar.height/2;
    d.animate([{left:sx+'px',top:sy+'px',transform:'translate(-50%,-50%) scale(.2)',opacity:0},{left:sx+(i-1)*60+'px',top:sy-40+'px',transform:'translate(-50%,-50%) scale(1.6)',opacity:1,offset:.35},
      {left:ex+'px',top:ey+'px',transform:'translate(-50%,-50%) scale(1)',opacity:1}],{duration:1500,delay:300+i*180,easing:'cubic-bezier(.4,0,.2,1)',fill:'both'}).onfinish=()=>d.remove()});
}
function showClear(){const D=dif();let rec={};try{rec=JSON.parse(localStorage.getItem('ac_clears')||'{}')}catch(e){}
  const k=G.diff||'easy',first=!rec[k];rec[k]=Math.max(rec[k]||0,G.hp);try{localStorage.setItem('ac_clears',JSON.stringify(rec))}catch(e){}
  $('#modal').innerHTML=`<h2 style="font-size:34px">🏆 通关！</h2><p><b style="color:${D.col}">${D.i} ${D.n}难度</b> · 第 ${G.clearRound} 回合击败最终首领伯纳德</p>
    <p>剩余生命 <b style="color:var(--gold)">${G.hp}</b> · 击败首领 ${G.bossesBeaten} 次${first?' · <b style="color:var(--gold)">首次通关！</b>':''}</p>
    <p style="color:var(--mute)">接下来是无尽模式：首领轮番回归、越来越强，看你能撑多久。</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn fight" id="bGoOn">继续无尽模式</button><button class="btn" id="bAgain2">换个难度再来</button></div>`;
  $('#overlay').classList.add('show');FX.flash('#ffd36e',400);
  $('#bGoOn').onclick=()=>{$('#overlay').classList.remove('show');if(G.hexOffer)renderHex()};$('#bAgain2').onclick=()=>newGame()}
function pickDiff(){const rec=(()=>{try{return JSON.parse(localStorage.getItem('ac_clears')||'{}')}catch(e){return{}}})();
  $('#modal').innerHTML=`<h2>选择难度</h2><p style="color:var(--mute);margin:0 0 14px">第 ${FINAL_R} 回合打败最终首领伯纳德即通关，之后可以继续无尽模式</p><div class="hexRow">${Object.entries(DIFF).map(([k,D])=>`<button class="hexCard diffCard" data-k="${k}" style="border-color:${D.col}"><span class="hi">${D.i}</span><b style="color:${D.col}">${D.n}</b><span>${D.d}</span>${rec[k]?'<span style="color:var(--gold)">✅ 已通关</span>':''}</button>`).join('')}</div>`;
  $('#overlay').classList.add('show');$('#modal').querySelectorAll('.diffCard').forEach(b=>b.onclick=()=>{G.diff=b.dataset.k;G.enemy=genEnemy(G.round);$('#overlay').classList.remove('show');render();toast(`${DIFF[G.diff].i} ${DIFF[G.diff].n}难度，开局！`)})}
function gameOver(){
  const r=G.round;if(r>best){best=r;try{localStorage.setItem('ac_best2',r)}catch(e){}}
  $('#modal').innerHTML=`<h2>游戏结束</h2><p>${dif().i} ${dif().n}难度 · 你坚持到了第 <b style="color:var(--gold)">${r}</b> 回合，击败首领 ${G.bossesBeaten} 次${G.cleared?'（已通关）':''}</p><p style="color:var(--mute)">最佳纪录：第 ${best} 回合</p><button class="btn fight" id="bAgain">再来一局</button>`;
  $('#overlay').classList.add('show');$('#bAgain').onclick=()=>newGame();clearSave();
}
$('#bRoll').onclick=()=>{if(G.phase!=='plan'||G.hexOffer)return;const p=rollPrice();if(G.gold<p)return;G.gold-=p;if(G.freeRoll>0)G.freeRoll--;rollShop();G.locked=false;render()};
$('#bXp').onclick=()=>{if(G.phase==='plan'&&!G.hexOffer&&G.gold>=4&&G.level<MAXLV){G.gold-=4;addXp(4);render()}};
$('#bLock').onclick=()=>{G.locked=!G.locked;render()};
$('#bSpeed').onclick=e=>{G.speed=G.speed===1?2:G.speed===2?4:1;e.currentTarget.textContent=`⏩ ${G.speed}x`};
$('#bFight').onclick=startBattle;
document.addEventListener('keydown',e=>{
  if(e.repeat||G.hexOffer)return;const k=e.key.toLowerCase();
  if(k==='d')$('#bRoll').click();else if(k==='f')$('#bXp').click();
  else if(k==='e'&&G.sel)sell(G.sel);else if(k===' '){e.preventDefault();startBattle()}
  else if(k==='escape'){G.sel=null;G.selItem=null;render()}
});
/* ---------- 舞台氛围：漂浮光斑 + 扫光 ---------- */
const AMB={cv:$('#amb'),p:[],t0:performance.now(),
  init(){const c=this.cv;c.width=innerWidth*Math.min(2,devicePixelRatio||1)*.5;c.height=innerHeight*Math.min(2,devicePixelRatio||1)*.5;this.x=c.getContext('2d');
    const n=Math.round(Math.min(70,c.width*c.height/9000));this.p=Array.from({length:n},()=>this.mk(true))},
  mk(any){const c=this.cv,cols=['#ff4fb8','#38e1ff','#ffc85a','#c48aff'];return{x:Math.random()*c.width,y:any?Math.random()*c.height:c.height+20,r:2+Math.random()*7,v:.15+Math.random()*.5,w:Math.random()*6.28,c:cols[(Math.random()*4)|0],a:.15+Math.random()*.35}},
  frame(now){const x=this.x,c=this.cv;if(!x)return;x.clearRect(0,0,c.width,c.height);const bt=document.body.classList.contains('battling'),k=(now-this.t0)/1000;
    x.globalCompositeOperation='lighter';
    for(let i=0;i<3;i++){const ang=Math.sin(k*.25+i*2.1)*.5,cx=c.width*(.2+.3*i),g=x.createLinearGradient(cx,0,cx,c.height);const col=['255,79,184','56,225,255','255,200,90'][i];
      g.addColorStop(0,`rgba(${col},${bt?.16:.08})`);g.addColorStop(1,'rgba(0,0,0,0)');x.save();x.translate(cx,-20);x.rotate(ang);x.fillStyle=g;x.beginPath();x.moveTo(-8,0);x.lineTo(8,0);x.lineTo(c.width*.16,c.height*1.1);x.lineTo(-c.width*.16,c.height*1.1);x.fill();x.restore()}
    for(const p of this.p){p.y-=p.v*(bt?1.8:1);p.w+=.01;const px=p.x+Math.sin(p.w)*14;if(p.y<-20)Object.assign(p,this.mk(false));
      const g=x.createRadialGradient(px,p.y,0,px,p.y,p.r*3);g.addColorStop(0,p.c);g.addColorStop(1,'transparent');x.globalAlpha=p.a*(.6+.4*Math.sin(k*2+p.w*3));x.fillStyle=g;x.beginPath();x.arc(px,p.y,p.r*3,0,7);x.fill()}
    x.globalAlpha=1;x.globalCompositeOperation='source-over'},
  loop(){const f=t=>{if(!document.hidden)this.frame(t);requestAnimationFrame(f)};requestAnimationFrame(f)}};
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){AMB.init();AMB.loop();addEventListener('resize',()=>AMB.init())}
/* 镜头推近 */
function punch(sc=1.05,ms=420){const b=$('#board');b.animate([{transform:'scale(1)'},{transform:'scale('+sc+')',offset:.3},{transform:'scale(1)'}],{duration:ms/Math.max(1,G.speed),easing:'cubic-bezier(.2,.8,.3,1)'})}
let _rz=0;window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{layoutBoard();if(B)draw();else render()},120)});
function fitPhone(){const r=document.documentElement;r.style.removeProperty('--cardImg');if(!isMob())return;requestAnimationFrame(()=>{const f=document.querySelector('footer'),m=document.querySelector('#itembar');const gap=f.getBoundingClientRect().top-m.getBoundingClientRect().bottom-parseFloat(getComputedStyle(m).marginBottom||0);const base=Math.min(74,innerHeight*.1),over=document.documentElement.scrollHeight-innerHeight;if(over>0)r.style.setProperty('--cardImg',Math.round(Math.max(46,base-over-2))+'px');else if(gap>6)r.style.setProperty('--cardImg',Math.round(Math.min(118,base+gap-6))+'px')})}
addEventListener('resize',()=>{clearTimeout(fitPhone.t);fitPhone.t=setTimeout(fitPhone,150)});
layoutBoard();{const sv=loadSave();if(sv)resumeGame(sv);else{newGame(true);pickDiff()}}renderPlayerBtn();cloudPull();setTimeout(fitPhone,60);$('#bPlayer').onclick=openPlayer;
$('#bNew').onclick=()=>{if(G.phase==='battle')return toast('战斗中不能重开');if(confirm('放弃当前进度，重新开始？'))newGame()};
if(/[?&]debug/.test(location.search))window.__AC={set SIM(v){SIM=v},get SIM(){return SIM},DIFF,lossDmg,BOSS,U,CK,BASES,SPECIALS,RECIPE,HEX,STK,traitCounts,tier,get G(){return G},get B(){return B},startBattle,tick,alive,genEnemy,offerHex,pickHex,equip,giveItem,addItem,tryMerge,render,mk,endBattle};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{layoutBoard();if(!B)render()});

}
